name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'version.json'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

env:
  HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www/data
          cp index.html style.css app-v2.js version.js update-check.js ui-fixes.js www/
          cp data/*.js www/data/

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android app version for update-safe installs
        working-directory: android
        env:
          APP_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          version = json.loads(Path('../version.json').read_text())['version']
          run_number = int(os.environ['APP_RUN_NUMBER'])
          s = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s, count=1)
          p.write_text(s)
          print(f'Android versionName={version}, versionCode={run_number}')
          PY

      - name: Set Android target SDK
        working-directory: android
        run: |
          sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle
          sed -i -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle

      - name: Verify persistent signing is configured
        if: ${{ env.HAS_RELEASE_KEY == '' }}
        run: |
          echo 'ERROR: Persistent Android signing is not configured.'
          echo 'Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to GitHub Actions secrets.'
          exit 1

      - name: Configure persistent release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dastyar-release.keystore
          test -s dastyar-release.keystore
          cat > keystore.properties <<EOF
          storeFile=dastyar-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              signing = '''android {\n    signingConfigs {\n        release {\n            def propsFile = rootProject.file("keystore.properties")\n            def props = new Properties()\n            if (propsFile.exists()) propsFile.withInputStream { props.load(it) }\n            storeFile rootProject.file(props['storeFile'])\n            storePassword props['storePassword']\n            keyAlias props['keyAlias']\n            keyPassword props['keyPassword']\n        }\n    }'''
              s = s.replace('android {', signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }', 1)
          p.write_text(s)
          PY

      - name: Diagnose release keystore and signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          echo '=== Android signing diagnostics (secret values are never printed) ==='
          echo '1) Keystore file:'
          if test -s dastyar-release.keystore; then
            echo '   OK: decoded keystore exists and is non-empty.'
            echo "   Size: $(stat -c%s dastyar-release.keystore) bytes"
            echo "   SHA-256: $(sha256sum dastyar-release.keystore | cut -d' ' -f1)"
            echo "   File type: $(file -b dastyar-release.keystore)"
          else
            echo '   FAIL: decoded keystore is missing or empty.'
            exit 1
          fi

          echo '2) Keystore format + store password:'
          jks_ok=0
          pkcs12_ok=0
          if keytool -list -storetype JKS -keystore dastyar-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            jks_ok=1
          fi
          if keytool -list -storetype PKCS12 -keystore dastyar-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            pkcs12_ok=1
          fi
          if [ "$jks_ok" -eq 1 ] || [ "$pkcs12_ok" -eq 1 ]; then
            echo '   OK: keystore is readable with the supplied store password.'
            if [ "$jks_ok" -eq 1 ]; then echo '   Detected format: JKS'; fi
            if [ "$pkcs12_ok" -eq 1 ]; then echo '   Detected format: PKCS12'; fi
          else
            echo '   FAIL: supplied store password does not open this decoded keystore.'
            echo '   The Base64 decoded file exists, so check that ANDROID_KEYSTORE_PASSWORD belongs to this exact keystore.'
            echo '   If the password is confirmed, replace ANDROID_KEYSTORE_BASE64 with a fresh Base64 encoding of the original keystore.'
            exit 1
          fi

          echo '3) Alias:'
          if keytool -list -keystore dastyar-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo '   OK: alias exists.'
          else
            echo '   FAIL: alias does not exist OR the supplied alias is incorrect.'
            exit 1
          fi

          echo '4) Private-key password:'
          if keytool -certreq -keystore dastyar-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file /tmp/dastyar-signing-check.csr >/dev/null 2>&1; then
            echo '   OK: private-key password is valid.'
            rm -f /tmp/dastyar-signing-check.csr
          else
            echo '   FAIL: private-key password is invalid OR alias does not identify a private key.'
            exit 1
          fi

          echo '=== All Android signing credentials are valid. ==='

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate APK is actually installable
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo '=== APK file ==='
          ls -lh "$APK"
          file "$APK"
          echo '=== ZIP integrity ==='
          unzip -t "$APK" >/dev/null
          echo 'OK: APK ZIP container is valid.'
          echo '=== ZIP alignment ==='
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          echo 'OK: APK is zip-aligned.'
          echo '=== Android manifest ==='
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | head -n 8
          echo 'OK: Android manifest can be parsed.'
          echo '=== APK signature ==='
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo 'OK: APK signature verification passed.'
          echo '=== Package identity ==='
          "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          echo '=== Final APK validation passed ==='

      - name: Rename verified APK
        run: |
          VERSION=$(node -p "require('./version.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/dastyar-khodro-${VERSION}-release.apk"
          sha256sum "dist/dastyar-khodro-${VERSION}-release.apk" | tee "dist/dastyar-khodro-${VERSION}-release.apk.sha256"
          ls -lh dist/

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-khodro-android-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
