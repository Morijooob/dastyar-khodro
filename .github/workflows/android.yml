name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www/data
          cp index.html style.css app.js www/
          cp data/*.js www/data/

      - name: Add Android platform
        run: npx cap add android

      - name: Set current Android target SDK
        working-directory: android
        run: |
          sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle
          sed -i -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-khodro-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
