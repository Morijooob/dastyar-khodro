name: Update market prices

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Tehran'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Update market feed
        run: python scripts/update_market_prices.py

      - name: Commit updated prices
        run: |
          if git diff --quiet -- data/market-prices.json; then
            echo 'No market price changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-prices.json
          git commit -m 'Update daily market prices'
          git push
