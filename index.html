<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار خودرو</title>
</head>
<body>
  <header><strong>🚗 دستیار خودرو</strong> <a href="#about">درباره ما</a></header>
  <main>
    <h1>ماشین مناسب تو کدومه؟ 🤔</h1>
    <p>بودجه و نیازت رو بگو تا بهترین گزینه‌ها رو برات پیدا کنیم.</p>
    <form>
      <label>💰 بودجه<br><input type="number" placeholder="مثلاً ۷۰۰" required> میلیون تومان</label><br><br>
      <fieldset><legend>⚙️ گیربکس</legend><label><input type="radio" name="gearbox" value="auto"> اتومات</label> <label><input type="radio" name="gearbox" value="manual"> دنده‌ای</label> <label><input type="radio" name="gearbox" value="any" checked> فرقی نداره</label></fieldset><br>
      <fieldset><legend>👨‍👩‍👧‍👦 نوع استفاده</legend><label><input type="radio" name="use" value="city" checked> شهری</label> <label><input type="radio" name="use" value="family"> خانوادگی</label> <label><input type="radio" name="use" value="travel"> سفر</label></fieldset><br>
      <fieldset><legend>⭐ مهم‌ترین اولویت</legend><label><input type="radio" name="priority" value="cheap" checked> کم‌خرج</label> <label><input type="radio" name="priority" value="fuel"> کم‌مصرف</label> <label><input type="radio" name="priority" value="resale"> فروش آسان</label></fieldset><br>
      <button type="submit">🚀 ماشین مناسب من را پیدا کن</button>
    </form>
    <section id="about"><h2>چطور کار می‌کنه؟</h2><p>① نیازت رو بگو &nbsp; ② گزینه‌ها رو بررسی می‌کنیم &nbsp; ③ بهترین‌ها رو پیشنهاد می‌دیم</p></section>
  </main>
</body>
</html>
