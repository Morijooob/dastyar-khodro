<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار خودرو | ماشین مناسب تو</title>
  <meta name="description" content="با بودجه و نیازت، ماشین مناسب خودت را پیدا کن.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <strong>🚗 دستیار خودرو</strong>
      <a href="#about">درباره ما</a>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <h1>ماشین مناسب تو کدومه؟ 🤔</h1>
      <p>بودجه و نیازت رو بگو تا بهترین گزینه‌ها رو برات پیدا کنیم.</p>
    </section>

    <form class="form-card" id="car-form">
      <div class="field">
        <label for="budget">💰 بودجه</label>
        <div class="budget-wrap"><input id="budget" type="number" min="1" placeholder="مثلاً ۷۰۰" required><span>میلیون تومان</span></div>
      </div>

      <fieldset><legend class="legend">⚙️ گیربکس</legend><div class="choices">
        <label class="choice"><input type="radio" name="gearbox" value="auto"><span>اتومات</span></label>
        <label class="choice"><input type="radio" name="gearbox" value="manual"><span>دنده‌ای</span></label>
        <label class="choice"><input type="radio" name="gearbox" value="any" checked><span>فرقی نداره</span></label>
      </div></fieldset>

      <fieldset><legend class="legend">👨‍👩‍👧‍👦 نوع استفاده</legend><div class="choices">
        <label class="choice"><input type="radio" name="use" value="city" checked><span>شهری</span></label>
        <label class="choice"><input type="radio" name="use" value="family"><span>خانوادگی</span></label>
        <label class="choice"><input type="radio" name="use" value="travel"><span>سفر</span></label>
      </div></fieldset>

      <fieldset><legend class="legend">⭐ مهم‌ترین اولویت</legend><div class="choices">
        <label class="choice"><input type="radio" name="priority" value="cheap" checked><span>کم‌خرج</span></label>
        <label class="choice"><input type="radio" name="priority" value="fuel"><span>کم‌مصرف</span></label>
        <label class="choice"><input type="radio" name="priority" value="resale"><span>فروش آسان</span></label>
      </div></fieldset>

      <button class="cta" type="submit">🚀 ماشین مناسب من را پیدا کن</button>
    </form>

    <section class="how" id="about">
      <h2>چطور کار می‌کنه؟</h2>
      <div class="steps">
        <div class="step"><b>۱️⃣</b><span>نیازت رو بگو</span></div>
        <div class="step"><b>۲️⃣</b><span>گزینه‌ها رو بررسی می‌کنیم</span></div>
        <div class="step"><b>۳️⃣</b><span>بهترین‌ها رو پیشنهاد می‌دیم</span></div>
      </div>
    </section>
  </main>
</body>
</html>
